name: Label bank format requests

# A "Bank statement format" request (from the Pocket Atlas app or the issue template)
# gets "new" when it comes in, and "bank: <name>" from the bank it is about — typed in
# the "- Bank:" line, the app's recognised profile, a known name, or a layout only one
# bank uses (.github/scripts/bank-label.js). Unknown: "bank: unknown" and one comment
# asking for the name; editing the issue re-labels it.
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: bank-label-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/bank-label.js`);
            await run({ github, context, core });
