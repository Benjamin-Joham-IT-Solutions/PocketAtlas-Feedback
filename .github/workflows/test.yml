name: Test

on:
  push:
    paths: ['.github/scripts/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/test.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test .github/scripts/bank-label.test.js
